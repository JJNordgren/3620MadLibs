{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mad Libs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'madlibs/style.css'%}" />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <a class="navbar-brand" href="{% url 'madlibs:home' %}">Mad Libs</a>
      <div class="navbar-nav ms-auto flex-row">
        <a class="nav-link px-3" href="{% url 'madlibs:home' %}">Home</a>
        <a class="nav-link px-3" href="{% url 'madlibs:play' %}">Play</a>
        <a class="nav-link px-3" href="{% url 'madlibs:submissions' %}">Submissions</a>
    {% if user.is_authenticated %}
      <a class="nav-link px-3" href="{% url 'profile' %}">Profile</a>

      <form method="POST" action="{% url 'logout' %}" class="m-0 p-0 d-inline-flex">
        {% csrf_token %}
        <button type="submit" class="nav-link px-3 btn btn-link m-0 p-0">
          Logout
        </button>
      </form>
    {% else %}
      <a class="nav-link px-3" href="{% url 'login' %}">Login</a>
      <a class="nav-link px-3" href="{% url 'register' %}">Register</a>
    {% endif %}
      </div>
    </nav>

    <main class="container py-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      {% block body %}{% endblock %}
    </main>
  </body>
</html>
